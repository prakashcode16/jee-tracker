<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JEE Mains 2027 — Prep Tracker</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta name="theme-color" content="#091413">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  /* ── Design tokens ──────────────────────────────────────── */
  :root{
    --bg:#f4f1ea;
    --surface:#fffdf9;
    --surface-2:#eeeae0;
    --line:#ded8cb;
    --line-soft:#e9e4d9;
    --ink:#1b1f1e;
    --ink-2:#555d5a;
    --ink-3:#8b9390;
    --accent:#0f6f5c;
    --accent-ink:#ffffff;
    --physics:#2f6db0;   --physics-bg:#e8f0f9;
    --chemistry:#2f8355; --chemistry-bg:#e6f2ea;
    --maths:#b3762a;     --maths-bg:#f8efe0;
    --danger:#b4462f;    --danger-bg:#f9e9e5;
    --done:#2f8355; --progress:#b3762a; --not-started:#b7b0a1;
    --radius:14px;
    --radius-sm:10px;
    --shadow:0 1px 2px rgba(20,25,24,.05), 0 4px 14px rgba(20,25,24,.045);
    --shadow-sm:0 1px 2px rgba(20,25,24,.05);
    --font:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --font-display:'Fraunces',Georgia,"Times New Roman",serif;
  }
  [data-theme="dark"]{
    --bg:#091413;
    --surface:#0f1d1b;
    --surface-2:#152523;
    --line:#223734;
    --line-soft:#1a2c2a;
    --ink:#e8efec;
    --ink-2:#9fb2ac;
    --ink-3:#6b817b;
    --accent:#3fbf9c;
    --accent-ink:#05100e;
    --physics:#69a8e8;   --physics-bg:#122636;
    --chemistry:#57ca8c; --chemistry-bg:#0d2a1e;
    --maths:#e3ad55;     --maths-bg:#2e2412;
    --danger:#e8806a;    --danger-bg:#331813;
    --done:#57ca8c; --progress:#e3ad55; --not-started:#3c4f4b;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
    --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  }

  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    font-family:var(--font);
    background:var(--bg);
    color:var(--ink);
    padding:0 0 max(4rem, env(safe-area-inset-bottom));
    transition:background .2s ease,color .2s ease;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  .wrap{max-width:1000px;margin:0 auto;padding:0 clamp(14px,4vw,24px);}

  /* ── Header ─────────────────────────────────────────────── */
  header.top{
    padding:clamp(18px,4vw,26px) 0 clamp(14px,3vw,18px);
    background:var(--surface);
    border-bottom:1px solid var(--line);
  }
  header.top .inner{
    max-width:1000px;margin:0 auto;padding:0 clamp(14px,4vw,24px);
    display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;
  }
  .title-block h1{
    font-family:var(--font-display);
    font-size:clamp(19px,4.5vw,26px);font-weight:600;margin:0 0 3px;letter-spacing:-0.015em;line-height:1.15;
  }
  .title-block p{margin:0;color:var(--ink-2);font-size:clamp(11.5px,2.7vw,13px);}
  .header-right{display:flex;align-items:center;gap:clamp(10px,3vw,16px);}
  .countdown{
    text-align:center;background:var(--accent);color:var(--accent-ink);
    border-radius:var(--radius-sm);padding:clamp(7px,2vw,10px) clamp(12px,3.5vw,18px);
    min-width:clamp(78px,22vw,110px);box-shadow:var(--shadow-sm);
  }
  .countdown .num{font-size:clamp(20px,5.5vw,28px);font-weight:700;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-0.02em;}
  .countdown .lbl{font-size:9.5px;text-transform:uppercase;letter-spacing:0.08em;opacity:.8;margin-top:3px;font-weight:600;}

  .theme-toggle{display:flex;align-items:center;gap:7px;}
  .theme-toggle .lbl{font-size:10px;color:var(--ink-3);text-transform:uppercase;letter-spacing:0.06em;font-weight:600;}
  @media(max-width:420px){.theme-toggle .lbl{display:none;}}
  .switch{position:relative;width:42px;height:24px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);cursor:pointer;flex-shrink:0;transition:background .15s ease;}
  .switch .knob{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--ink-3);transition:left .18s cubic-bezier(.4,0,.2,1),background .15s ease;}
  .switch.on{background:var(--accent);border-color:var(--accent);}
  .switch.on .knob{left:20px;background:var(--accent-ink);}

  /* ── Nav ────────────────────────────────────────────────── */
  nav.tabs{
    display:flex;gap:2px;background:var(--surface);
    border-bottom:1px solid var(--line);
    max-width:1000px;margin:0 auto;padding:0 clamp(14px,4vw,24px);
    overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;
  }
  nav.tabs::-webkit-scrollbar{display:none;}
  nav.tabs button{
    appearance:none;border:none;background:none;cursor:pointer;
    padding:11px 13px;font-size:13.5px;color:var(--ink-2);
    border-bottom:2px solid transparent;margin-bottom:-1px;font-family:inherit;
    white-space:nowrap;font-weight:500;transition:color .15s ease;
  }
  nav.tabs button.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:650;}
  nav.tabs button:hover{color:var(--ink);}

  main{padding-top:clamp(16px,4vw,24px);}
  h2.section-h{
    font-family:var(--font-display);
    font-size:clamp(15px,3.6vw,17px);font-weight:600;margin:clamp(20px,5vw,26px) 0 12px;letter-spacing:-0.01em;
  }
  h2.section-h:first-child{margin-top:0;}
  .hint{font-size:12px;color:var(--ink-3);margin:-6px 0 12px;line-height:1.5;}

  /* ── Cards & stats ──────────────────────────────────────── */
  .stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(8px,2vw,12px);margin-bottom:12px;}
  @media(max-width:700px){.stat-row{grid-template-columns:repeat(2,1fr);}}
  .stat{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);
    padding:clamp(11px,2.8vw,14px);box-shadow:var(--shadow-sm);min-width:0;
  }
  .stat .v{font-size:clamp(17px,4.4vw,21px);font-weight:700;letter-spacing:-0.02em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;}
  .stat .k{font-size:10px;color:var(--ink-3);text-transform:uppercase;letter-spacing:0.06em;margin-top:3px;font-weight:600;}

  .qs-row{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(8px,2vw,12px);margin-bottom:clamp(14px,4vw,20px);}
  @media(max-width:560px){.qs-row{grid-template-columns:1fr;}}
  .qs-card{border-radius:var(--radius-sm);padding:clamp(10px,2.6vw,13px);border:1px solid transparent;min-width:0;}
  .qs-card.physics{background:var(--physics-bg);border-color:color-mix(in srgb,var(--physics) 22%,transparent);}
  .qs-card.chemistry{background:var(--chemistry-bg);border-color:color-mix(in srgb,var(--chemistry) 22%,transparent);}
  .qs-card.maths{background:var(--maths-bg);border-color:color-mix(in srgb,var(--maths) 22%,transparent);}
  .qs-card .v{font-size:clamp(15px,4vw,18px);font-weight:700;letter-spacing:-0.02em;}
  .qs-card .k{font-size:10px;text-transform:uppercase;letter-spacing:0.06em;opacity:.8;margin-top:3px;font-weight:600;}
  .qs-card.physics .v{color:var(--physics);}
  .qs-card.chemistry .v{color:var(--chemistry);}
  .qs-card.maths .v{color:var(--maths);}

  .overview-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(10px,2.5vw,14px);margin-bottom:clamp(18px,5vw,26px);}
  @media(max-width:700px){.overview-grid{grid-template-columns:1fr;}}
  .subj-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:clamp(13px,3.2vw,17px);box-shadow:var(--shadow-sm);min-width:0;}
  .subj-card .head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;gap:8px;}
  .subj-card .name{font-weight:650;font-size:14.5px;}
  .subj-card .pct{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums;font-weight:600;}
  .bar{height:7px;border-radius:99px;background:var(--surface-2);overflow:hidden;}
  .bar .fill{height:100%;border-radius:99px;transition:width .3s cubic-bezier(.4,0,.2,1);}
  .subj-card.physics .fill{background:var(--physics);}
  .subj-card.chemistry .fill{background:var(--chemistry);}
  .subj-card.maths .fill{background:var(--maths);}
  .subj-card .meta{margin-top:9px;font-size:11.5px;color:var(--ink-3);}
  .weak-tag{display:inline-block;font-size:9.5px;background:var(--danger-bg);color:var(--danger);padding:2px 7px;border-radius:99px;margin-left:6px;vertical-align:middle;font-weight:700;text-transform:uppercase;letter-spacing:.04em;}

  /* ── Pills ──────────────────────────────────────────────── */
  .pill-tabs,.subj-tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;}
  .pill-tabs button,.subj-tabs button{
    appearance:none;cursor:pointer;font-family:inherit;font-size:12.5px;font-weight:600;
    padding:7px 14px;border-radius:99px;border:1px solid var(--line);
    background:var(--surface);color:var(--ink-2);transition:all .15s ease;
  }
  .pill-tabs button:hover,.subj-tabs button:hover{border-color:var(--ink-3);}
  .pill-tabs button.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
  .pill-tabs button.active.physics,.subj-tabs button.active.physics{background:var(--physics-bg);border-color:var(--physics);color:var(--physics);}
  .pill-tabs button.active.chemistry,.subj-tabs button.active.chemistry{background:var(--chemistry-bg);border-color:var(--chemistry);color:var(--chemistry);}
  .pill-tabs button.active.maths,.subj-tabs button.active.maths{background:var(--maths-bg);border-color:var(--maths);color:var(--maths);}

  /* ── Lists / chapters ───────────────────────────────────── */
  .chapter-list{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--surface);box-shadow:var(--shadow-sm);}
  .chapter-row{border-bottom:1px solid var(--line-soft);}
  .chapter-row:last-child{border-bottom:none;}
  .chapter-head{display:flex;align-items:center;gap:10px;padding:12px clamp(12px,3vw,16px);cursor:pointer;font-size:14px;transition:background .12s ease;}
  .chapter-head:hover{background:var(--surface-2);}
  .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .dot.not-started{background:var(--not-started);}
  .dot.in-progress{background:var(--progress);}
  .dot.done{background:var(--done);}
  .chapter-head .cinfo{flex:1;min-width:0;}
  .chapter-head .cname{font-weight:550;line-height:1.3;overflow-wrap:anywhere;}
  .chapter-head .csub{font-size:11px;color:var(--ink-3);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;}
  .chapter-head .csub b{font-weight:600;color:var(--ink-2);}
  .chevron{font-size:10px;color:var(--ink-3);transition:transform .18s ease;flex-shrink:0;}
  .chevron.open{transform:rotate(90deg);}
  .chapter-body{padding:2px clamp(12px,3vw,16px) 14px;display:none;}
  .chapter-body.open{display:block;}

  .qbox{display:flex;align-items:center;gap:5px;flex-shrink:0;}
  .qbox input{
    width:54px;font-family:inherit;font-size:13px;text-align:center;
    border:1px solid var(--line);border-radius:8px;padding:5px 4px;
    background:var(--bg);color:var(--ink);
  }
  .qbox input:focus{outline:none;border-color:var(--accent);}
  .qbox .qlbl{font-size:9.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;font-weight:600;}
  @media(max-width:480px){.qbox .qlbl{display:none;} .qbox input{width:48px;}}

  .lec-table-v{width:100%;border-collapse:collapse;}
  .lec-table-v th{font-size:10px;color:var(--ink-3);font-weight:700;text-align:center;padding:6px 10px;border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.05em;}
  .lec-table-v td{padding:7px 10px;text-align:center;border-bottom:1px solid var(--line-soft);}
  .lec-table-v tr:last-child td{border-bottom:none;}
  .lec-table-v .rlabel{text-align:left;font-size:12px;color:var(--ink-3);width:40px;font-variant-numeric:tabular-nums;}
  .lec-table-v th.rlabel{text-align:left;}

  input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent);cursor:pointer;}

  .practice-list{columns:3;column-gap:20px;}
  @media(max-width:700px){.practice-list{columns:2;}}
  @media(max-width:400px){.practice-list{columns:1;}}
  .practice-row{display:flex;align-items:center;gap:9px;padding:8px 10px;font-size:13px;break-inside:avoid;border-radius:8px;cursor:pointer;transition:background .12s ease;}
  .practice-row:hover{background:var(--surface-2);}

  /* ── Forms ──────────────────────────────────────────────── */
  .form-row{
    display:flex;gap:clamp(8px,2vw,11px);flex-wrap:wrap;margin-bottom:14px;
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:clamp(12px,3vw,16px);align-items:flex-start;box-shadow:var(--shadow-sm);
  }
  .form-row input,.form-row select,.form-row textarea{
    font-family:inherit;font-size:16px;border:1px solid var(--line);border-radius:9px;
    padding:9px 10px;background:var(--bg);color:var(--ink);max-width:100%;
  }
  @media(min-width:700px){.form-row input,.form-row select,.form-row textarea{font-size:13.5px;}}
  .form-row input:focus,.form-row select:focus,.form-row textarea:focus{outline:none;border-color:var(--accent);}
  .form-row input[type=date]{min-width:0;width:100%;max-width:170px;}
  .form-row input[type=number]{width:92px;}
  .form-row textarea{width:100%;min-height:46px;resize:vertical;}
  .fgroup{display:flex;flex-direction:column;gap:5px;min-width:0;}
  .fgroup label{font-size:10px;color:var(--ink-3);text-transform:uppercase;letter-spacing:0.06em;font-weight:700;}
  .time-combo{display:flex;gap:5px;align-items:center;}
  .time-combo select{width:74px;}
  .add-btn{
    background:var(--accent);color:var(--accent-ink);border:none;border-radius:9px;
    padding:10px 18px;font-size:13.5px;font-weight:650;cursor:pointer;font-family:inherit;
    transition:opacity .15s ease;white-space:nowrap;
  }
  .add-btn:hover{opacity:.88;}
  .add-btn.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line);}
  .add-btn.danger{background:var(--danger);color:#fff;}

  /* ── Log & test items ───────────────────────────────────── */
  .log-list,.test-list{display:flex;flex-direction:column;gap:8px;}
  .log-item,.test-item{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);
    padding:12px clamp(12px,3vw,16px);display:flex;justify-content:space-between;
    align-items:flex-start;gap:12px;box-shadow:var(--shadow-sm);
  }
  .log-item .l-left,.test-item .t-left{flex:1;min-width:0;}
  .log-item .date,.test-item .date{font-weight:650;font-size:13px;}
  .log-item .hrs{color:var(--ink-2);font-size:13px;margin-left:8px;}
  .log-item .qbits{font-size:11.5px;color:var(--ink-3);margin-top:4px;}
  .log-item .notes{color:var(--ink-2);font-size:12.5px;margin-top:5px;line-height:1.45;overflow-wrap:anywhere;}
  .test-item .name{font-size:12.5px;color:var(--ink-2);margin-top:2px;overflow-wrap:anywhere;}
  .test-item .score{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .del-btn{background:none;border:none;color:var(--ink-3);cursor:pointer;font-size:11.5px;padding:3px 6px;border-radius:6px;font-family:inherit;flex-shrink:0;}
  .del-btn:hover{color:var(--danger);background:var(--danger-bg);}
  .empty{color:var(--ink-3);font-size:12.5px;padding:24px 16px;text-align:center;background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius);line-height:1.5;}

  .date-pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
  .date-pills button{
    appearance:none;cursor:pointer;font-family:inherit;font-size:11.5px;padding:6px 12px;
    border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font-variant-numeric:tabular-nums;
  }
  .date-pills button.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600;}
  .date-pills button.clear{border-style:dashed;}

  /* ── Analysis ───────────────────────────────────────────── */
  .insight{
    background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--ink-3);
    border-radius:var(--radius-sm);padding:clamp(12px,3vw,15px);margin-bottom:9px;box-shadow:var(--shadow-sm);
  }
  .insight.warn{border-left-color:var(--danger);}
  .insight.good{border-left-color:var(--done);}
  .insight.info{border-left-color:var(--progress);}
  .insight .ititle{font-weight:650;font-size:13.5px;margin-bottom:5px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
  .insight .ibody{font-size:12.5px;color:var(--ink-2);line-height:1.55;overflow-wrap:anywhere;}
  .insight .ibody b{color:var(--ink);font-weight:600;}
  .badge{font-size:9.5px;padding:2px 7px;border-radius:99px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;}
  .badge.physics{background:var(--physics-bg);color:var(--physics);}
  .badge.chemistry{background:var(--chemistry-bg);color:var(--chemistry);}
  .badge.maths{background:var(--maths-bg);color:var(--maths);}
  .badge.danger{background:var(--danger-bg);color:var(--danger);}

  .gap-list{display:flex;flex-direction:column;gap:7px;}
  .gap-item{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);
    padding:11px clamp(11px,3vw,15px);display:flex;align-items:center;gap:11px;box-shadow:var(--shadow-sm);
  }
  .gap-item .gname{flex:1;min-width:0;font-size:13px;font-weight:550;overflow-wrap:anywhere;}
  .gap-item .gmeta{font-size:11px;color:var(--ink-3);margin-top:3px;font-weight:400;}
  .gap-item .gstat{font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink-2);white-space:nowrap;text-align:right;font-weight:600;}
  .minibar{width:clamp(54px,16vw,80px);height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;flex-shrink:0;}
  .minibar .mfill{height:100%;border-radius:99px;}

  .auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .auth-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:clamp(22px,6vw,30px);max-width:360px;width:100%;box-shadow:var(--shadow);}
  .auth-card h1{font-family:var(--font-display);font-size:21px;margin:0 0 5px;letter-spacing:-0.015em;}
  .auth-card p.sub{font-size:12.5px;color:var(--ink-3);margin:0 0 20px;line-height:1.5;}
  .auth-tabs{display:flex;gap:3px;margin-bottom:16px;background:var(--bg);border-radius:10px;padding:3px;}
  .auth-tabs button{flex:1;appearance:none;border:none;background:none;padding:8px;font-size:12.5px;font-weight:650;border-radius:8px;cursor:pointer;color:var(--ink-2);font-family:inherit;}
  .auth-tabs button.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm);}
  .auth-field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;}
  .auth-field label{font-size:10px;color:var(--ink-3);text-transform:uppercase;letter-spacing:0.06em;font-weight:700;}
  .auth-field input{font-family:inherit;font-size:16px;border:1px solid var(--line);border-radius:9px;padding:10px 11px;background:var(--bg);color:var(--ink);}
  .auth-field input:focus{outline:none;border-color:var(--accent);}
  .auth-submit{width:100%;background:var(--accent);color:var(--accent-ink);border:none;border-radius:9px;padding:11px;font-size:13.5px;font-weight:650;cursor:pointer;font-family:inherit;margin-top:4px;}
  .auth-submit:hover{opacity:.9;}
  .auth-divider{display:flex;align-items:center;gap:10px;margin:16px 0;color:var(--ink-3);font-size:10.5px;font-weight:600;letter-spacing:.06em;}
  .auth-divider::before,.auth-divider::after{content:'';flex:1;height:1px;background:var(--line);}

function rowToLog(r){ return { id:r.id, date:r.date, subject:r.subject, hours:r.hours, minutes:r.minutes, questionsSolved:r.questions_solved, notes:r.notes }; }
function rowToTest(r){ return { id:r.id, date:r.date, name:r.name, score:r.score, percentile:r.percentile }; }

// OR-merges boolean progress so one device can never erase a checkbox another device just set.
// (Trade-off: unchecking a box may not "stick" across devices — see the note in chat.)
function mergeShell(remote, local){
  remote = remote || {}; local = local || {};
  const merged = { chapters:{}, practiceSessions:{}, settings: local.settings || remote.settings, theme: local.theme || remote.theme };
  const subjects = new Set([...Object.keys(remote.chapters||{}), ...Object.keys(local.chapters||{})]);
  subjects.forEach(subj=>{
    merged.chapters[subj] = {};
    const rSubj = (remote.chapters||{})[subj] || {};
    const lSubj = (local.chapters||{})[subj] || {};
    const names = new Set([...Object.keys(rSubj), ...Object.keys(lSubj)]);
    names.forEach(name=>{
      const r = rSubj[name], l = lSubj[name];
      const len = (l && l.lectures) ? l.lectures.length : ((r && r.lectures) ? r.lectures.length : 0);
      const lectures=[], dpps=[];
      for(let i=0;i<len;i++){
        lectures.push(!!(r && r.lectures && r.lectures[i]) || !!(l && l.lectures && l.lectures[i]));
        dpps.push(!!(r && r.dpps && r.dpps[i]) || !!(l && l.dpps && l.dpps[i]));
      }
      merged.chapters[subj][name] = { lectures, dpps, questions: Math.max(Number((r&&r.questions)||0), Number((l&&l.questions)||0)) };
    });
  });
  const psSubjects = new Set([...Object.keys(remote.practiceSessions||{}), ...Object.keys(local.practiceSessions||{})]);
  psSubjects.forEach(subj=>{
    merged.practiceSessions[subj] = {};
    const rSubj = (remote.practiceSessions||{})[subj] || {};
    const lSubj = (local.practiceSessions||{})[subj] || {};
    const labels = new Set([...Object.keys(rSubj), ...Object.keys(lSubj)]);
    labels.forEach(lbl=>{ merged.practiceSessions[subj][lbl] = !!rSubj[lbl] || !!lSubj[lbl]; });
  });
  return merged;
}

async function pushLogsAndTestsToCloud(logs, tests){
  if(!CLOUD_ENABLED || !currentUser) return { logs: logs||[], tests: tests||[] };
  let newLogs = [], newTests = [];
  if(logs && logs.length){
    const toInsert = logs.map(l=>({ user_id:currentUser.id, date:l.date, subject:l.subject, hours:Number(l.hours||0), minutes:Number(l.minutes||0), questions_solved:Number(l.questionsSolved||0), notes:l.notes||'' }));
    try{ const { data, error } = await sb.from('study_logs').insert(toInsert).select(); if(!error) newLogs = (data||[]).map(rowToLog); }catch(e){ console.error('log migration failed', e); }
  }
  if(tests && tests.length){
    const toInsert = tests.map(t=>({ user_id:currentUser.id, date:t.date, name:t.name, score: t.score!=null?String(t.score):null, percentile: t.percentile!=null?String(t.percentile):null }));
    try{ const { data, error } = await sb.from('test_scores').insert(toInsert).select(); if(!error) newTests = (data||[]).map(rowToTest); }catch(e){ console.error('test migration failed', e); }
  }
  return { logs:newLogs, tests:newTests };
}

  });
}

function loadLocalOnly(){
  try{
    const raw = localStorage.getItem('jee-tracker-state');
    if(raw) normalizeLoadedState(JSON.parse(raw));
    else normalizeLoadedState({});
  }catch(e){ normalizeLoadedState({}); }
  render();
}

async function loadStateFromCloud(){
  try{
    const { data: rowData, error: rowErr } = await sb.from('tracker_state').select('data').eq('user_id', currentUser.id).maybeSingle();
    if(rowErr) throw rowErr;
    const shell = rowData && rowData.data ? rowData.data : {};
    normalizeLoadedState(shell);

    const [{ data: logRows, error: logErr }, { data: testRows, error: testErr }] = await Promise.all([
      sb.from('study_logs').select('*').eq('user_id', currentUser.id),
      sb.from('test_scores').select('*').eq('user_id', currentUser.id)
    ]);
    if(logErr) throw logErr;
    if(testErr) throw testErr;

    let logs = (logRows||[]).map(rowToLog);
    let tests = (testRows||[]).map(rowToTest);

    // One-time migration: older saves kept logs/tests inside the shell blob — move them into their own tables.
    if(logs.length===0 && Array.isArray(shell.logs) && shell.logs.length>0){
      const pushed = await pushLogsAndTestsToCloud(shell.logs, []);
      logs = pushed.logs;
    }
    if(tests.length===0 && Array.isArray(shell.tests) && shell.tests.length>0){
      const pushed = await pushLogsAndTestsToCloud([], shell.tests);
      tests = pushed.tests;
    }

    state.logs = logs.sort((a,b)=>a.date.localeCompare(b.date));
    state.tests = tests.sort((a,b)=>a.date.localeCompare(b.date));
    localStorage.setItem('jee-tracker-cache', JSON.stringify(state));
  }catch(e){
    console.error('cloud load failed, using offline cache', e);
    try{
      const raw = localStorage.getItem('jee-tracker-cache');
      normalizeLoadedState(raw ? JSON.parse(raw) : {});
    }catch(e2){ normalizeLoadedState({}); }
  }
  render();
}

// Saves only the "shell" (syllabus checkmarks, practice sessions, settings, theme).
// Logs and test scores are saved instantly and separately — see addLogEntry / addTestEntry.
function saveState(){
  try{ localStorage.setItem(CLOUD_ENABLED ? 'jee-tracker-cache' : 'jee-tracker-state', JSON.stringify(state)); }
  catch(e){ console.error('local cache save failed', e); }
  if(!CLOUD_ENABLED || !currentUser) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{
      const { data: current } = await sb.from('tracker_state').select('data').eq('user_id', currentUser.id).maybeSingle();
      const merged = mergeShell(current && current.data, shellOf(state));
      await sb.from('tracker_state').upsert({ user_id: currentUser.id, data: merged, updated_at: new Date().toISOString() });
    }catch(e){ console.error('cloud save failed', e); }
  }, 700);
}

function daysLeft(){
  const ms = Date.parse(state.settings.examDate+'T00:00:00+05:30') - Date.parse(todayIST()+'T00:00:00+05:30');
  return Math.round(ms/86400000);
}

function chapterStatus(entry){
  const total = entry.lectures.length + entry.dpps.length;
  const done = entry.lectures.filter(Boolean).length + entry.dpps.filter(Boolean).length;
  if(done===0) return 'not-started';
  if(done===total) return 'done';
  return 'in-progress';
}

function subjectProgress(subj){
  const chs = state.chapters[subj] || {};
  let doneUnits=0, totalUnits=0, doneChapters=0;
  const keys = Object.keys(chs);
  keys.forEach(k=>{
    const e = chs[k];
    const total = e.lectures.length + e.dpps.length;
    const done = e.lectures.filter(Boolean).length + e.dpps.filter(Boolean).length;
    doneUnits += done; totalUnits += total;
    if(done===total) doneChapters++;
  });
  return { pct: totalUnits? Math.round((doneUnits/totalUnits)*100) : 0, doneChapters, totalChapters:keys.length };
}

function minutesToHM(mins){
  const h = Math.floor(mins/60), m = mins%60;
  return (h>0? h+'h ':'') + (m>0||h===0? m+'m':'');
}

function logsForDate(date){ return state.logs.filter(l=>l.date===date); }
function logsForPeriod(period){
  if(period==='alltime') return state.logs.slice();
  const today = todayIST();
  if(period==='daily') return logsForDate(today);
  const cutoff = new Date(Date.parse(today+'T00:00:00+05:30') - 6*86400000).toLocaleDateString('en-CA',{timeZone:'Asia/Kolkata'});
  return state.logs.filter(l=>l.date>=cutoff && l.date<=today);
}
function timeBySubjectForDate(date){
  const logs = logsForDate(date);
  const bySubj = {physics:0, chemistry:0, maths:0, general:0};
  logs.forEach(l=>{
    const mins = Number(l.hours||0)*60 + Number(l.minutes||0);
    const key = (l.subject||'General').toLowerCase();
    if(bySubj.hasOwnProperty(key)) bySubj[key]+=mins; else bySubj.general+=mins;
  });
  return bySubj;
}
function aggregateLogs(logs, subjectFilter){
  let totalMinutes=0, totalQs=0;
  logs.forEach(l=>{
    const mins = Number(l.hours||0)*60 + Number(l.minutes||0);
    if(subjectFilter==='all'){
      totalMinutes += mins;
      totalQs += Number(l.questionsSolved||0);
    } else if(l.subject===SUBJECT_META[subjectFilter].label){
      totalMinutes += mins;
      totalQs += Number(l.questionsSolved||0);
    }
  });
  return {totalMinutes, totalQs};
}
function questionsTotalForDate(date){
  const logs = logsForDate(date);
  const bySubj = {physics:0, chemistry:0, maths:0};
  logs.forEach(l=>{
    const key = (l.subject||'').toLowerCase();
    if(bySubj.hasOwnProperty(key)) bySubj[key] += Number(l.questionsSolved||0);
  });
  return bySubj;
}
function minutesTotalForDate(date){
  return logsForDate(date).reduce((s,l)=>s+Number(l.hours||0)*60+Number(l.minutes||0),0);
}
function avgPercentile(){
  const vals = state.tests.filter(t=>t.percentile!=='' && t.percentile!=null).map(t=>Number(t.percentile));
  if(vals.length===0) return '—';
  return (vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1);
}

    banner.className = 'cloud-banner';

    app.appendChild(banner);
  }
  const header = document.createElement('header');
  header.className = 'top';
  header.innerHTML = `
    <div class="inner">
      <div class="title-block">
        <h1>JEE Mains 2027 — prep tracker</h1>
        <p>Target attempt: ${formatExamDate(state.settings.examDate)} &middot; ${weakSubjectsText()}</p>
      </div>
      <div class="header-right">
        <div class="theme-toggle">
          <span class="lbl">${state.theme==='dark'?'Dark':'Light'}</span>
          <div class="switch ${state.theme==='dark'?'on':''}" id="theme-switch"><div class="knob"></div></div>
        </div>
        <div class="countdown"><div class="num">${daysLeft()}</div><div class="lbl">days to go</div></div>
      </div>
    </div>`;
  app.appendChild(header);
  header.querySelector('#theme-switch').onclick = ()=>{
    state.theme = state.theme==='dark' ? 'light' : 'dark';
    saveState(); render();
  };

  const nav = document.createElement('nav');
  nav.className = 'tabs';
  [['dashboard','Dashboard'],['analysis','Analysis'],['syllabus','Syllabus'],['practice','Practice sessions'],['log','Daily log'],['tests','Test scores'],['settings','Settings']].forEach(([id,label])=>{
    const b = document.createElement('button');
    b.textContent = label;
    if(id===currentTab) b.classList.add('active');
    b.onclick = ()=>{ currentTab=id; render(); };
    nav.appendChild(b);
  });
  app.appendChild(nav);

  const main = document.createElement('main');
  const wrap = document.createElement('div'); wrap.className='wrap'; wrap.style.padding='0';
  if(currentTab==='dashboard') wrap.appendChild(renderDashboard());
  else if(currentTab==='syllabus') wrap.appendChild(renderSyllabus());
  else if(currentTab==='log') wrap.appendChild(renderLog());
  else if(currentTab==='practice') wrap.appendChild(renderPractice());
  else if(currentTab==='tests') wrap.appendChild(renderTests());
  else if(currentTab==='settings') wrap.appendChild(renderSettings());
  else if(currentTab==='analysis') wrap.appendChild(renderAnalysis());
  main.appendChild(wrap);
  app.appendChild(main);
}

function renderSyllabus(){
  const d = document.createElement('div');
  const tabsWrap = document.createElement('div');
  tabsWrap.className = 'subj-tabs';
  Object.keys(SYLLABUS).forEach(subj=>{
    const meta = SUBJECT_META[subj];
    const b = document.createElement('button');
    b.textContent = meta.label;
    b.className = subj===currentSubjectTab ? `active ${meta.color}` : '';
    b.onclick = ()=>{ currentSubjectTab = subj; render(); };
    tabsWrap.appendChild(b);
  });
  d.appendChild(tabsWrap);

  const list = document.createElement('div');
  list.className = 'chapter-list';
  SYLLABUS[currentSubjectTab].forEach(([ch,count])=>{
    const entry = state.chapters[currentSubjectTab][ch];
    const key = currentSubjectTab+'::'+ch;
    const isOpen = expandedChapters.has(key);
    const lecDone = entry.lectures.filter(Boolean).length;
    const dppDone = entry.dpps.filter(Boolean).length;

    const row = document.createElement('div');
    row.className = 'chapter-row';

    const head = document.createElement('div');
    head.className = 'chapter-head';
    head.innerHTML = `
      <span class="dot ${chapterStatus(entry)}"></span>
      <span class="cinfo">
        <div class="cname">${ch}</div>
        <div class="csub"><span><b>${lecDone}</b>/${count} lec</span><span><b>${dppDone}</b>/${count} DPP</span><span><b>${entry.questions||0}</b> Qs</span></div>
      </span>`;
    head.onclick = ()=>{
      if(expandedChapters.has(key)) expandedChapters.delete(key); else expandedChapters.add(key);
      render();
    };

    const qbox = document.createElement('span');
    qbox.className = 'qbox';
    qbox.onclick = (ev)=>ev.stopPropagation();
    const qlbl = document.createElement('span'); qlbl.className='qlbl'; qlbl.textContent='Qs';
    const qInput = document.createElement('input');
    qInput.type='number'; qInput.min='0'; qInput.value = entry.questions||0;
    qInput.onchange = ()=>{
      entry.questions = Math.max(0, Number(qInput.value)||0);
      saveState(); render();
    };
    qbox.appendChild(qlbl); qbox.appendChild(qInput);
    head.appendChild(qbox);

    const chev = document.createElement('span');
    chev.className = 'chevron' + (isOpen?' open':'');
    chev.innerHTML = '&#9656;';
    head.appendChild(chev);

    row.appendChild(head);

    const body = document.createElement('div');
    body.className = 'chapter-body' + (isOpen?' open':'');
    if(isOpen){
      const table = document.createElement('table'); table.className='lec-table-v';
      const headRow = document.createElement('tr');
      headRow.innerHTML = `<th class="rlabel">#</th><th>Lecture</th><th>DPP</th>`;
      table.appendChild(headRow);
      for(let i=0;i<count;i++){
        const tr = document.createElement('tr');
        const numTd = document.createElement('td'); numTd.className='rlabel'; numTd.textContent = i+1;
        tr.appendChild(numTd);

        const lecTd = document.createElement('td');
        const lecCb = document.createElement('input'); lecCb.type='checkbox'; lecCb.checked=entry.lectures[i];
        lecCb.onchange = ()=>{ entry.lectures[i]=lecCb.checked; saveState(); render(); };
        lecTd.appendChild(lecCb);
        tr.appendChild(lecTd);

        const dppTd = document.createElement('td');
        const dppCb = document.createElement('input'); dppCb.type='checkbox'; dppCb.checked=entry.dpps[i];
        dppCb.onchange = ()=>{ entry.dpps[i]=dppCb.checked; saveState(); render(); };
        dppTd.appendChild(dppCb);
        tr.appendChild(dppTd);

        table.appendChild(tr);
      }
      body.appendChild(table);
    }
    row.appendChild(body);
    list.appendChild(row);
  });
  d.appendChild(list);
  return d;
}

function logItemEl(l, withDelete){

function renderRangeReport(){
  const wrap = document.createElement('div');
  const form = document.createElement('div'); form.className = 'form-row';
  form.innerHTML = `
    <div class="fgroup"><label>From</label><input type="date" id="range-start" value="${rangeStart||''}"></div>
    <div class="fgroup"><label>To</label><input type="date" id="range-end" value="${rangeEnd||''}"></div>
    <button class="add-btn" id="range-show" type="button" style="align-self:flex-end;">Show report</button>
  `;
  wrap.appendChild(form);
  form.querySelector('#range-show').onclick = ()=>{
    const s = form.querySelector('#range-start').value;
    const e = form.querySelector('#range-end').value;
    if(!s || !e){ return; }
    rangeStart = s; rangeEnd = (e<s ? s : e); rangeExpanded = new Set();
    render();
  };

  if(!rangeStart || !rangeEnd) return wrap;

  const dates = Array.from(new Set(state.logs.map(l=>l.date)))
    .filter(dt=>dt>=rangeStart && dt<=rangeEnd)
    .sort((a,b)=>a.localeCompare(b));

  if(dates.length===0){
    const e = document.createElement('div'); e.className='empty';
    e.textContent = 'No logged sessions in that date range.';
    wrap.appendChild(e);
    return wrap;
  }

  const totalMins = dates.reduce((s,dt)=>s+minutesTotalForDate(dt),0);
  const totalQsAll = dates.reduce((s,dt)=>{
    const q = questionsTotalForDate(dt); return s+q.physics+q.chemistry+q.maths;
  },0);
  const rangeSummary = document.createElement('div');
  rangeSummary.className='stat-row'; rangeSummary.style.cssText='grid-template-columns:repeat(2,1fr);margin-bottom:14px;';
  rangeSummary.innerHTML = `
    <div class="stat"><div class="v">${minutesToHM(totalMins)}</div><div class="k">Total time in range</div></div>
    <div class="stat"><div class="v">${totalQsAll}</div><div class="k">Total questions in range</div></div>
  `;
  wrap.appendChild(rangeSummary);

  const list = document.createElement('div'); list.className = 'chapter-list';
  dates.forEach(dt=>{
    const mins = minutesTotalForDate(dt);
    const qs = questionsTotalForDate(dt);
    const qsTotal = qs.physics+qs.chemistry+qs.maths;
    const timeBySubj = timeBySubjectForDate(dt);
    const isOpen = rangeExpanded.has(dt);

    const row = document.createElement('div'); row.className = 'chapter-row';
    const head = document.createElement('div'); head.className = 'chapter-head';
    head.innerHTML = `
      <span class="cinfo">
        <div class="cname">${dt}</div>
        <div class="csub">${minutesToHM(mins)} &middot; ${qsTotal} questions</div>
      </span>
      <span class="chevron ${isOpen?'open':''}">&#9656;</span>`;
    head.onclick = ()=>{
      if(rangeExpanded.has(dt)) rangeExpanded.delete(dt); else rangeExpanded.add(dt);
      render();
    };
    row.appendChild(head);

    if(isOpen){
      const body = document.createElement('div'); body.className = 'chapter-body open';
      body.style.padding = '4px 16px 16px';
      const qsRow = document.createElement('div');
      qsRow.className = 'qs-row'; qsRow.style.marginBottom = '0';
      qsRow.innerHTML = `
        <div class="qs-card physics"><div class="v">${minutesToHM(timeBySubj.physics)}</div><div class="k">Physics &middot; ${qs.physics} Qs</div></div>
        <div class="qs-card chemistry"><div class="v">${minutesToHM(timeBySubj.chemistry)}</div><div class="k">Chemistry &middot; ${qs.chemistry} Qs</div></div>
        <div class="qs-card maths"><div class="v">${minutesToHM(timeBySubj.maths)}</div><div class="k">Maths &middot; ${qs.maths} Qs</div></div>
      `;
      body.appendChild(qsRow);
      if(timeBySubj.general>0){
        const genNote = document.createElement('div');
        genNote.style.cssText = 'font-size:11.5px;color:var(--ink-faint);margin-top:8px;';
        genNote.textContent = `+ ${minutesToHM(timeBySubj.general)} logged as general/mixed`;
        body.appendChild(genNote);
      }
      row.appendChild(body);
    }
    list.appendChild(row);
  });
  wrap.appendChild(list);
  return wrap;
}

        <select id="log-hours">${Array.from({length:13},(_,i)=>`<option value="${i}">${i} h</option>`).join('')}</select>
        <select id="log-minutes">${[0,5,10,15,20,25,30,35,40,45,50,55].map(m=>`<option value="${m}">${m} m</option>`).join('')}</select>

  `;
  d.appendChild(form);
  form.querySelector('#log-add').onclick = ()=>{
    const date = form.querySelector('#log-date').value || todayIST();
    const subject = form.querySelector('#log-subject').value;
    const hours = form.querySelector('#log-hours').value;
    const minutes = form.querySelector('#log-minutes').value;
    const questionsSolved = form.querySelector('#log-qs').value || 0;
    const notes = form.querySelector('#log-notes').value.trim();
    if(Number(hours)===0 && Number(minutes)===0 && !Number(questionsSolved) && !notes) return;
    addLogEntry({date, subject, hours, minutes, questionsSolved, notes});
  };

  const h2 = document.createElement('h2'); h2.className='section-h'; h2.textContent='Summary';
  d.appendChild(h2);

  const periodTabs = document.createElement('div'); periodTabs.className='pill-tabs';
  [['daily','Daily'],['weekly','Weekly'],['alltime','All time']].forEach(([id,label])=>{
    const b = document.createElement('button'); b.textContent=label;
    if(id===logPeriod) b.classList.add('active');
    b.onclick = ()=>{ logPeriod=id; render(); };
    periodTabs.appendChild(b);
  });
  d.appendChild(periodTabs);

  const subjTabs = document.createElement('div'); subjTabs.className='pill-tabs';
  [['all','All (PCM)'],['physics','Physics'],['chemistry','Chemistry'],['maths','Maths']].forEach(([id,label])=>{
    const b = document.createElement('button'); b.textContent=label;
    let cls = id===logSubjectFilter ? 'active' : '';
    if(id!=='all' && id===logSubjectFilter) cls += ' '+id;
    b.className = cls;
    b.onclick = ()=>{ logSubjectFilter=id; render(); };
    subjTabs.appendChild(b);
  });
  d.appendChild(subjTabs);

  const periodLogs = logsForPeriod(logPeriod);
  const agg = aggregateLogs(periodLogs, logSubjectFilter);
  const periodLabel = {daily:'today', weekly:'last 7 days', alltime:'all time'}[logPeriod];
  const summary = document.createElement('div');
  summary.className = 'stat-row';
  summary.style.marginBottom = '20px';
  summary.innerHTML = `
    <div class="stat"><div class="v">${minutesToHM(agg.totalMinutes)}</div><div class="k">Time (${periodLabel})</div></div>
    <div class="stat"><div class="v">${agg.totalQs}</div><div class="k">Questions (${periodLabel})</div></div>
  `;
  d.appendChild(summary);

  const h3b = document.createElement('h2'); h3b.className='section-h'; h3b.textContent='Date range report';
  d.appendChild(h3b);
  d.appendChild(renderRangeReport());

  const h3 = document.createElement('h2'); h3.className='section-h'; h3.textContent='Browse by date';
  d.appendChild(h3);
  const dateList = Array.from(new Set(state.logs.map(l=>l.date))).sort((a,b)=>b.localeCompare(a));
  const pills = document.createElement('div'); pills.className='date-pills';
  const clearBtn = document.createElement('button');
  clearBtn.textContent = 'All entries'; clearBtn.className = 'clear' + (selectedLogDate===null?' active':'');
  clearBtn.onclick = ()=>{ selectedLogDate=null; render(); };
  pills.appendChild(clearBtn);
  dateList.forEach(dt=>{
    const b = document.createElement('button'); b.textContent = dt;
    if(dt===selectedLogDate) b.classList.add('active');
    b.onclick = ()=>{ selectedLogDate = dt; render(); };
    pills.appendChild(b);
  });
  d.appendChild(pills);

  const h4 = document.createElement('h2'); h4.className='section-h';
  h4.textContent = selectedLogDate ? `Sessions on ${selectedLogDate}` : 'All sessions';
  d.appendChild(h4);

  if(selectedLogDate){
    const dayMins = minutesTotalForDate(selectedLogDate);
    const dayQs = questionsTotalForDate(selectedLogDate);
    const dayQsTotal = dayQs.physics + dayQs.chemistry + dayQs.maths;
    const daySummary = document.createElement('div');
    daySummary.className = 'stat-row'; daySummary.style.cssText = 'grid-template-columns:repeat(2,1fr);margin-bottom:12px;';
    daySummary.innerHTML = `
      <div class="stat"><div class="v">${minutesToHM(dayMins)}</div><div class="k">Time studied</div></div>
      <div class="stat"><div class="v">${dayQsTotal}</div><div class="k">Questions solved</div></div>
    `;
    d.appendChild(daySummary);
    const dayQsRow = document.createElement('div');
    dayQsRow.className = 'qs-row'; dayQsRow.style.marginBottom = '16px';
    dayQsRow.innerHTML = `
      <div class="qs-card physics"><div class="v">${dayQs.physics}</div><div class="k">Physics Qs</div></div>
      <div class="qs-card chemistry"><div class="v">${dayQs.chemistry}</div><div class="k">Chemistry Qs</div></div>
      <div class="qs-card maths"><div class="v">${dayQs.maths}</div><div class="k">Maths Qs</div></div>
    `;
    d.appendChild(dayQsRow);
  }

  const shown = selectedLogDate ? logsForDate(selectedLogDate) : state.logs.slice().reverse();
  if(shown.length===0){
    const e = document.createElement('div'); e.className='empty'; e.textContent = 'Nothing logged for this view yet.';
    d.appendChild(e);
  }else{
    const list = document.createElement('div'); list.className='log-list';
    shown.forEach(l=> list.appendChild(logItemEl(l, true)));
    d.appendChild(list);
  }
  return d;
}

      left.innerHTML = `<span class="date">${t.date}</span><div class="name">${escapeHtml(t.name)}${t.score?` &middot; score ${t.score}`:''}</div>`;
      item.appendChild(left);
      const right = document.createElement('div'); right.style.cssText='display:flex;align-items:center;gap:10px;';
      right.innerHTML = `<span class="score">${t.percentile!==''&&t.percentile!=null?t.percentile+'%ile':'—'}</span>`;
      const btn = document.createElement('button'); btn.className='del-btn'; btn.textContent='Remove';
      btn.onclick = ()=>{ deleteTestEntry(t); };
      right.appendChild(btn);
      item.appendChild(right);
      list.appendChild(item);
    });
    d.appendChild(list);
  }
  return d;
}

function insightEl(kind, title, bodyHtml, badge){
  const el = document.createElement('div');
  el.className = 'insight '+kind;
  el.innerHTML = `<div class="ititle">${title}${badge?` <span class="badge ${badge[1]}">${badge[0]}</span>`:''}</div><div class="ibody">${bodyHtml}</div>`;
  return el;
}

function analyseChapters(){
  const out = { lagging:[], untouched:[], noQuestions:[], complete:[] };
  Object.keys(SYLLABUS).forEach(subj=>{
    SYLLABUS[subj].forEach(([ch,count])=>{
      const e = state.chapters[subj][ch];
      if(!e) return;
      const lec = e.lectures.filter(Boolean).length;
      const dpp = e.dpps.filter(Boolean).length;
      const qs = Number(e.questions||0);
      const rec = {subj, ch, count, lec, dpp, qs, gap: lec-dpp};
      if(lec===0 && dpp===0) out.untouched.push(rec);
      else if(lec-dpp >= 2) out.lagging.push(rec);
      if(lec>0 && qs===0) out.noQuestions.push(rec);
      if(lec===count && dpp===count) out.complete.push(rec);
    });
  });
  out.lagging.sort((a,b)=>b.gap-a.gap);
  return out;
}

function recentDaysStats(days){
  const today = todayIST();
  const cutoff = new Date(Date.parse(today+'T00:00:00+05:30') - (days-1)*86400000).toLocaleDateString('en-CA',{timeZone:'Asia/Kolkata'});
  const logs = state.logs.filter(l=>l.date>=cutoff && l.date<=today);
  const dates = new Set(logs.map(l=>l.date));
  const mins = logs.reduce((s,l)=>s+Number(l.hours||0)*60+Number(l.minutes||0),0);
  const bySubj = {physics:0, chemistry:0, maths:0, general:0};
  const qsBySubj = {physics:0, chemistry:0, maths:0};
  logs.forEach(l=>{
    const m = Number(l.hours||0)*60+Number(l.minutes||0);
    const k = (l.subject||'General').toLowerCase();
    if(bySubj.hasOwnProperty(k)) bySubj[k]+=m; else bySubj.general+=m;
    if(qsBySubj.hasOwnProperty(k)) qsBySubj[k]+=Number(l.questionsSolved||0);
  });
  return { logs, activeDays:dates.size, windowDays:days, mins, bySubj, qsBySubj };
}

function currentStreak(){
  const dates = new Set(state.logs.map(l=>l.date));
  let streak = 0;
  let cursor = Date.parse(todayIST()+'T00:00:00+05:30');
  // today doesn't break the streak if not yet logged
  if(!dates.has(new Date(cursor).toLocaleDateString('en-CA',{timeZone:'Asia/Kolkata'}))) cursor -= 86400000;
  while(true){
    const d = new Date(cursor).toLocaleDateString('en-CA',{timeZone:'Asia/Kolkata'});
    if(dates.has(d)){ streak++; cursor -= 86400000; } else break;
  }
  return streak;
}

function renderAnalysis(){
  const d = document.createElement('div');
  const ch = analyseChapters();
  const r14 = recentDaysStats(14);
  const streak = currentStreak();

  // ── Headline numbers
  const totalQsChapters = Object.keys(SYLLABUS).reduce((s,subj)=>
    s + SYLLABUS[subj].reduce((t,[c])=>t+Number((state.chapters[subj][c]||{}).questions||0),0), 0);
  const psDone = Object.keys(SUBJECT_META).reduce((s,subj)=>
    s + PRACTICE_SESSIONS[subj].filter(l=>state.practiceSessions[subj][l]).length, 0);
  const psTotal = Object.keys(SUBJECT_META).reduce((s,subj)=>s+PRACTICE_SESSIONS[subj].length,0);

  const top = document.createElement('div');
  top.className = 'stat-row';
  top.innerHTML = `
    <div class="stat"><div class="v">${streak}</div><div class="k">Day streak</div></div>
    <div class="stat"><div class="v">${r14.activeDays}/14</div><div class="k">Days active (2 wks)</div></div>
    <div class="stat"><div class="v">${totalQsChapters}</div><div class="k">Chapter Qs logged</div></div>
    <div class="stat"><div class="v">${psDone}/${psTotal}</div><div class="k">Practice sessions</div></div>
  `;
  d.appendChild(top);

  // ── What needs correcting
  const h1 = document.createElement('h2'); h1.className='section-h'; h1.textContent='What needs correcting';
  d.appendChild(h1);

  const insights = [];

  if(ch.lagging.length){
    const top5 = ch.lagging.slice(0,5).map(c=>`<b>${c.ch}</b> (${c.lec} lec vs ${c.dpp} DPP)`).join(', ');
    insights.push(insightEl('warn','Lectures are running ahead of practice',
      `${ch.lagging.length} chapter${ch.lagging.length>1?'s are':' is'} at least 2 DPPs behind the lectures you've watched. Biggest gaps: ${top5}. Watching without solving is the fastest way to feel productive and still lose marks — clear these DPPs before starting new chapters.`));
  }

  if(ch.noQuestions.length){
    const names = ch.noQuestions.slice(0,6).map(c=>c.ch).join(', ');
    insights.push(insightEl('warn','Chapters with zero questions attempted',
      `${ch.noQuestions.length} chapter${ch.noQuestions.length>1?'s have':' has'} lectures watched but no questions logged: ${names}${ch.noQuestions.length>6?', …':''}. A chapter isn't learnt until you've been beaten by its questions.`));
  }

  const weak = Object.keys(SUBJECT_META).filter(s=>state.settings.weakSubjects[s]);
  if(weak.length && r14.mins>0){
    weak.forEach(s=>{
      const share = Math.round((r14.bySubj[s]/r14.mins)*100);
      if(share < 25){
        insights.push(insightEl('warn',`${SUBJECT_META[s].label} is flagged weak but under-studied`,
          `Only <b>${share}%</b> of your logged time in the last 2 weeks went to ${SUBJECT_META[s].label} (${minutesToHM(r14.bySubj[s])}). Weak subjects need more time than strong ones, not less.`, ['Weak area','danger']));
      }
    });
  }

  if(r14.activeDays < 7){
    insights.push(insightEl('warn','Consistency is the bottleneck',
      `You logged study on <b>${r14.activeDays} of the last 14 days</b>. At this rate the syllabus won't close before ${formatExamDate(state.settings.examDate)}. Logging even a 30-minute session keeps the habit visible.`));
  }

  if(psTotal>0 && psDone/psTotal < 0.15 && r14.activeDays>0){
    insights.push(insightEl('info','Practice sessions are barely started',
      `<b>${psDone} of ${psTotal}</b> practice sessions ticked off. These are the closest thing you have to exam-condition reps — they're worth prioritising over re-watching lectures.`));
  }

  if(state.tests.length>0){
    const withP = state.tests.filter(t=>t.percentile!==''&&t.percentile!=null);
    if(withP.length>=2){
      const first = Number(withP[0].percentile), last = Number(withP[withP.length-1].percentile);
      const diff = (last-first).toFixed(1);
      if(last>=first){
        insights.push(insightEl('good','Test scores are trending up',
          `Percentile moved from <b>${first}</b> to <b>${last}</b> across ${withP.length} tests (+${diff}). Whatever changed in between, keep doing it.`));
      } else {
        insights.push(insightEl('warn','Test scores have slipped',
          `Percentile moved from <b>${first}</b> to <b>${last}</b> (${diff}). Worth checking whether this lines up with the chapters where your DPPs are lagging.`));
      }
    }
  } else {
    insights.push(insightEl('info','No test scores logged yet',
      `Tests are the only honest feedback on whether the hours are converting. Log your next one under the Test scores tab.`));
  }

  if(ch.complete.length>0){
    insights.push(insightEl('good',`${ch.complete.length} chapter${ch.complete.length>1?'s':''} fully closed out`,
      `Lectures and DPPs both complete: ${ch.complete.slice(0,4).map(c=>`<b>${c.ch}</b>`).join(', ')}${ch.complete.length>4?', …':''}. Schedule a revision pass on these before they go stale.`));
  }

  if(insights.length===0){
    const e = document.createElement('div'); e.className='empty';
    e.textContent = 'Not enough data yet — log a few study sessions and tick off some lectures, and this tab will start flagging gaps.';
    d.appendChild(e);
  } else {
    insights.forEach(i=>d.appendChild(i));
  }

  // ── Practice gap table
  if(ch.lagging.length){
    const h2 = document.createElement('h2'); h2.className='section-h'; h2.textContent='Biggest practice gaps';
    d.appendChild(h2);
    const hint = document.createElement('p'); hint.className='hint';
    hint.textContent = 'Chapters where DPPs trail the lectures you have already watched.';
    d.appendChild(hint);
    const list = document.createElement('div'); list.className='gap-list';
    ch.lagging.slice(0,10).forEach(c=>{
      const pct = c.count? Math.round((c.dpp/c.count)*100) : 0;
      const item = document.createElement('div'); item.className='gap-item';
      item.innerHTML = `
        <span class="gname">${c.ch}<div class="gmeta"><span class="badge ${SUBJECT_META[c.subj].color}">${SUBJECT_META[c.subj].label}</span> &nbsp;${c.qs} Qs logged</div></span>
        <span class="minibar"><span class="mfill" style="width:${pct}%;background:var(--${SUBJECT_META[c.subj].color})"></span></span>
        <span class="gstat">${c.dpp}/${c.count} DPP</span>`;
      list.appendChild(item);
    });
    d.appendChild(list);
  }

  // ── Where your time goes
  const h3 = document.createElement('h2'); h3.className='section-h'; h3.textContent='Where your time went (last 14 days)';
  d.appendChild(h3);
  if(r14.mins===0){
    const e = document.createElement('div'); e.className='empty'; e.textContent='No sessions logged in the last two weeks.';
    d.appendChild(e);
  } else {
    const grid = document.createElement('div'); grid.className='overview-grid';
    Object.keys(SUBJECT_META).forEach(subj=>{
      const meta = SUBJECT_META[subj];
      const share = Math.round((r14.bySubj[subj]/r14.mins)*100);
      const card = document.createElement('div');
      card.className = `subj-card ${meta.color}`;
      card.innerHTML = `
        <div class="head"><span class="name">${meta.label}${state.settings.weakSubjects[subj]?'<span class="weak-tag">weak</span>':''}</span><span class="pct">${share}%</span></div>
        <div class="bar"><div class="fill" style="width:${share}%"></div></div>
        <div class="meta">${minutesToHM(r14.bySubj[subj])} &middot; ${r14.qsBySubj[subj]} questions</div>`;
      grid.appendChild(card);
    });
    d.appendChild(grid);
  }

  // ── Untouched chapters
  const h4 = document.createElement('h2'); h4.className='section-h'; h4.textContent='Not started yet';
  d.appendChild(h4);
  if(ch.untouched.length===0){
    const e = document.createElement('div'); e.className='empty'; e.textContent='Every chapter has at least been opened. Good.';
    d.appendChild(e);
  } else {
    const bySubj = {};
    ch.untouched.forEach(c=>{ (bySubj[c.subj]=bySubj[c.subj]||[]).push(c.ch); });
    Object.keys(bySubj).forEach(subj=>{
      const el = insightEl('info',
        `${SUBJECT_META[subj].label} — ${bySubj[subj].length} untouched`,
        bySubj[subj].join(' &middot; '),
        [SUBJECT_META[subj].label, SUBJECT_META[subj].color]);
      d.appendChild(el);
    });
  }

  return d;
}

function renderSettings(){
  const d = document.createElement('div');

  if(CLOUD_ENABLED && currentUser){
    const hAcc = document.createElement('h2'); hAcc.className='section-h'; hAcc.textContent='Account';
    d.appendChild(hAcc);
    const accRow = document.createElement('div'); accRow.className='form-row';
    accRow.innerHTML = `<div class="fgroup"><label>Signed in as</label><div style="font-size:13px;padding-top:4px;">${escapeHtml(currentUser.email||'')}</div></div>`;
    const signOutBtn = document.createElement('button'); signOutBtn.className='add-btn'; signOutBtn.textContent='Sign out'; signOutBtn.type='button';
    signOutBtn.style.alignSelf='flex-end';
    signOutBtn.onclick = async ()=>{ await sb.auth.signOut(); };
    accRow.appendChild(signOutBtn);
    d.appendChild(accRow);
  }

  const h = document.createElement('h2'); h.className='section-h'; h.textContent='Exam date';
  d.appendChild(h);
  const dateForm = document.createElement('div'); dateForm.className='form-row';
  dateForm.innerHTML = `<div class="fgroup"><label>Target attempt date</label><input type="date" id="set-examdate" value="${state.settings.examDate}"></div>`;
  d.appendChild(dateForm);
  dateForm.querySelector('#set-examdate').onchange = (e)=>{
    if(e.target.value){ state.settings.examDate = e.target.value; saveState(); render(); }
  };

  const h2 = document.createElement('h2'); h2.className='section-h'; h2.textContent='Weak subjects';
  d.appendChild(h2);
  const p = document.createElement('p'); p.style.cssText='font-size:12.5px;color:var(--ink-faint);margin:-4px 0 12px;';
  p.textContent = 'Flagged subjects get a "weak area" badge on the dashboard.';
  d.appendChild(p);
  const weakForm = document.createElement('div'); weakForm.className='form-row';
  Object.keys(SUBJECT_META).forEach(subj=>{
    const label = document.createElement('label');
    label.style.cssText = 'display:flex;align-items:center;gap:6px;font-size:13px;';
    const cb = document.createElement('input'); cb.type='checkbox'; cb.checked = state.settings.weakSubjects[subj];
    cb.onchange = ()=>{ state.settings.weakSubjects[subj]=cb.checked; saveState(); render(); };
    label.appendChild(cb);
    label.appendChild(document.createTextNode(SUBJECT_META[subj].label));
    weakForm.appendChild(label);
  });
  d.appendChild(weakForm);

  const h3 = document.createElement('h2'); h3.className='section-h'; h3.textContent='Your data';
  d.appendChild(h3);
  const dataForm = document.createElement('div'); dataForm.className='form-row';
  dataForm.innerHTML = `
    <button class="add-btn ghost" id="set-export" type="button">Download backup</button>
    <label class="add-btn ghost" style="display:inline-flex;align-items:center;cursor:pointer;">
      Import backup<input type="file" id="set-import" accept="application/json" style="display:none;">
    </label>
    <button class="add-btn danger" id="set-reset" type="button">Reset all data</button>
  `;
  d.appendChild(dataForm);

  dataForm.querySelector('#set-export').onclick = ()=>{
    const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'jee-tracker-backup-'+todayIST()+'.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  dataForm.querySelector('#set-import').onchange = (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = async ()=>{
      try{
        const parsed = JSON.parse(reader.result);
        normalizeLoadedState(parsed);
        const importedLogs = state.logs, importedTests = state.tests;
        if(CLOUD_ENABLED && currentUser){
          try{
            await sb.from('study_logs').delete().eq('user_id', currentUser.id);
            await sb.from('test_scores').delete().eq('user_id', currentUser.id);
          }catch(err){ console.error('clearing old cloud rows failed', err); }
          const pushed = await pushLogsAndTestsToCloud(importedLogs, importedTests);
          state.logs = pushed.logs; state.tests = pushed.tests;
        }
        saveState(); render();
      }catch(err){ alert('That file could not be read as a valid backup.'); }
    };
    reader.readAsText(file);
  };

  dataForm.querySelector('#set-reset').onclick = ()=>{
    if(confirm('This clears all logged progress, syllabus checkmarks, and test scores. This cannot be undone. Continue?')){
      (async ()=>{
        const keepTheme = state.theme;
        if(CLOUD_ENABLED && currentUser){
          try{
            await sb.from('study_logs').delete().eq('user_id', currentUser.id);
            await sb.from('test_scores').delete().eq('user_id', currentUser.id);
          }catch(err){ console.error('cloud reset failed', err); }
        }
        localStorage.removeItem('jee-tracker-state');
        localStorage.removeItem('jee-tracker-cache');
        normalizeLoadedState({});
        state.theme = keepTheme;
        saveState(); render();
      })();
    }
  };

  return d;
}

function escapeHtml(str){ const div=document.createElement('div'); div.textContent=str; return div.innerHTML; }

boot();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('service-worker.js').catch(()=>{ /* not fatal */ });
  });
}
</script>
